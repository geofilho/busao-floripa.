name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Testar o leitor de horários
        run: sh tests/run.sh

      - name: Compilar APK
        run: gradle --no-daemon assembleRelease

      - name: Novidades desta versão
        run: (git log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session' || true) > novidades.txt

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk BusaoFloripa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BusaoFloripa-apk
          path: BusaoFloripa.apk

      - name: Publicar versão para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Busão Floripa G ${{ github.run_number }}
          make_latest: true
          body_path: novidades.txt
          files: BusaoFloripa.apk

      # A página de versões fica só com a última e a penúltima (a atualização do app usa a última).
      - name: Manter só as duas últimas versões
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' |
          sort -V -r | tail -n +3 |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "$tag apagada da página de versões"
          done

